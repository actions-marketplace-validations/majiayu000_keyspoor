name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Cargo, npm and tag versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          cargo = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          npm = json.loads(pathlib.Path('npm/package.json').read_text())['version']
          if cargo != npm:
              raise SystemExit('Cargo and npm versions must match')
          tag = f'v{cargo}'
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != tag:
              raise SystemExit('Release tag must match the package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={cargo}\ntag={tag}\n')
          PY

  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target '${{ matrix.target }}'
      - name: Build release binary
        run: cargo +stable build --release --locked --target '${{ matrix.target }}' --bin keyspoor
      - name: Check version and stage asset
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="target/$TARGET/release/keyspoor$EXE_SUFFIX"
          version="$("$binary" --version)"
          test "$version" = "keyspoor ${RELEASE_TAG#v}"
          mkdir -p dist
          cp "$binary" "dist/keyspoor-$RELEASE_TAG-$TARGET$EXE_SUFFIX"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyspoor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package:
    name: Assemble and verify npm package
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keyspoor-*
          path: dist
          merge-multiple: true
      - name: Assemble and pack
        run: |
          node npm/scripts/stage.mjs dist
          npm test --prefix npm
          npm pack ./npm --pack-destination dist
      - name: Verify installed package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/check_npm_package.py "dist/keyspoor-$VERSION.tgz" "$VERSION"
      - name: Create checksums
        working-directory: dist
        run: |
          cp ../LICENSE ../THIRD_PARTY_NOTICES .
          sha256sum keyspoor-* LICENSE THIRD_PARTY_NOTICES > SHA256SUMS
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  npm:
    name: Publish npm with trusted publishing
    if: github.event_name == 'push'
    needs: [version, checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify and publish the tested tarball
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish "keyspoor-$VERSION.tgz" --access public --provenance

  npm-check:
    name: Verify npm registry install
    if: github.event_name == 'push'
    needs: [version, npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Wait for npm registry visibility
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.error, urllib.request
          version = os.environ['VERSION']
          url = f'https://registry.npmjs.org/keyspoor/{version}'
          deadline = time.monotonic() + 600
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      if json.load(response)['version'] != version:
                          raise SystemExit('Registry returned an unexpected version')
                  print(f'keyspoor@{version} is visible in the npm registry')
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise SystemExit('npm package remained unavailable for 10 minutes') from error
                  print('npm is still processing the published version; checking again shortly', flush=True)
                  time.sleep(min(30, remaining))
          PYTHON
      - name: Verify registry install
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/check_npm_package.py "keyspoor@$VERSION" "$VERSION"

  crates:
    name: Publish crates.io with trusted publishing
    if: github.event_name == 'push'
    needs: [checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Obtain temporary crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked

  github:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [version, npm-check, crates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Keyspoor $RELEASE_TAG" --generate-notes
