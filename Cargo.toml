[package]
name = "secret-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Independent Rust secret detection engine with an agent-friendly CLI"
license = "Apache-2.0"
include = ["/src/**", "/tests/**", "/examples/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
aho-corasick = "1"
base64 = "0.22"
regex = "1"
regex-syntax = "0.8"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
